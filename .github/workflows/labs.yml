name: Executable course labs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify reference contracts and security boundaries
        working-directory: reference
        run: python -m unittest discover -s tests -v
      - name: Run fixture evaluation release gate
        working-directory: reference
        run: python -m support_lab eval
      - name: Execute all labs
        working-directory: reference
        run: python -m support_lab lab all
